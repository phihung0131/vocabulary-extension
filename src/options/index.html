<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt · Vocab Flow</title>
  <link rel="stylesheet" href="../assets/styles/tailwind.css">
</head>
<body class="options-page">
  <main class="options-shell">
    <section class="options-hero">
      <span class="options-logo">VF</span>
      <p>EXTENSION SETTINGS</p>
      <h1>Kết nối extension với vocabulary-server.</h1>
      <span>Model, API key, batch size và delay đều được quản lý trong file <code>.env</code> của server.</span>
    </section>
    <section class="options-card">
      <div class="option-field">
        <label for="serverUrl">SERVER URL</label>
        <input id="serverUrl" type="url">
        <small>Không thêm dấu / ở cuối. Extension cần quyền truy cập domain này.</small>
      </div>
      <div class="option-field">
        <label for="theme">GIAO DIỆN</label>
        <select id="theme"><option value="light">Sáng</option><option value="dark">Tối</option><option value="auto">Theo hệ thống</option></select>
      </div>
      <div id="serverInfo" class="server-info hidden"></div>
      <div class="options-actions">
        <button id="testBtn" class="option-secondary">Kiểm tra</button>
        <button id="saveBtn" class="option-primary">Lưu cài đặt</button>
      </div>
      <div id="status" class="option-status hidden" role="status"></div>
    </section>
  </main>
  <script type="module" src="./index.ts"></script>
</body>
</html>

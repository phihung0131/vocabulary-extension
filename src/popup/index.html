<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Flow</title>
  <link rel="stylesheet" href="../assets/styles/tailwind.css">
</head>
<body class="extension-popup">
  <main class="popup-shell">
    <header class="popup-header">
      <div class="popup-brand">
        <span class="popup-logo">VF</span>
        <div><h1>Vocab Flow</h1><p id="connectionText">Đang kết nối server…</p></div>
      </div>
      <button id="settingsBtn" class="icon-control" aria-label="Cài đặt">⚙</button>
    </header>

    <section class="popup-hero">
      <span class="hero-kicker">QUICK CAPTURE</span>
      <h2>Giữ từ mới trước khi bạn quên.</h2>
      <div class="capture-row">
        <input id="wordInput" class="popup-input" type="text" placeholder="Nhập từ tiếng Anh" autocomplete="off">
        <button id="addWordBtn" class="popup-primary">Thêm</button>
      </div>
      <p class="micro-copy">Queue được đồng bộ với web server.</p>
    </section>

    <section class="popup-card">
      <div class="section-head">
        <div><h3>Hàng đợi</h3><p>Tối đa 20 từ mỗi batch</p></div>
        <span id="queueCount" class="popup-count">0</span>
      </div>
      <div id="queueList" class="popup-queue"></div>
      <div id="emptyState" class="popup-empty"><strong>Chưa có từ nào</strong><span>Chọn text và chuột phải hoặc nhập ở trên.</span></div>
      <div id="progressBox" class="progress-box hidden">
        <div class="progress-track"><span></span></div>
        <p>AI đang tạo 2–3 collocations cho mỗi từ…</p>
      </div>
      <button id="generateBtn" class="popup-primary full">Tạo collocations</button>
    </section>

    <section class="quick-grid">
      <button id="homeBtn" class="quick-action"><span>↗</span><strong>Mở web</strong><small>Hàng đợi</small></button>
      <button id="manageBtn" class="quick-action"><span>⌕</span><strong>Thư viện</strong><small>Tìm & sửa</small></button>
      <button id="exportCsvBtn" class="quick-action"><span>↓</span><strong>CSV</strong><small>Xuất Anki</small></button>
      <button id="deleteAllBtn" class="quick-action danger"><span>×</span><strong>Xóa hết</strong><small>Dữ liệu server</small></button>
    </section>
  </main>
  <div id="toastHost" class="toast-host"></div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
